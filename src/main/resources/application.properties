spring.application.name=orthanc-scan-producer
server.port=3000

# RabbitMQ credentials live in the git-ignored application-secrets.properties (see README); it
# overrides the guest defaults below when present.
spring.config.import=optional:classpath:application-secrets.properties

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.scans.exchange=orthanc.scans
app.scans.queue=orthanc.scans
app.scans.routing-key=scan.created

app.cors.allowed-origins=http://localhost:4200

# orthanc-scan-consumer, asked whether a lot is on hold before a scan is published.
app.consumer.base-url=http://localhost:3001

# Last lot-stage catalog fetched from the consumer, served when the consumer can't be reached.
app.lot-stages.cache-file=./data/lot-stages.json
