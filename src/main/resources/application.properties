spring.application.name=orthanc-scan-producer
server.port=3000

# RabbitMQ credentials live in the git-ignored application-secrets.properties (see README); it
# overrides the guest defaults below when present.
spring.config.import=optional:classpath:application-secrets.properties

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

app.scans.exchange=orthanc.scans
app.scans.queue=orthanc.scans
app.scans.routing-key=scan.created
# Where the consumer sends scans it gives up on (must match the consumer's settings).
app.scans.dead-letter-exchange=orthanc.scans.dlx
app.scans.dead-letter-queue=orthanc.scans.dlq
# Deletes the scans and dead-letter queues after this long unused. Only for developer queues (see README,
# mode 2), set in application-local.properties to the same value in both apps.
#app.scans.queue-expires=7d

app.cors.allowed-origins=http://localhost:4200

# orthanc-scan-consumer, asked whether a lot is on hold before a scan is published.
app.consumer.base-url=http://localhost:3001
# Lot lookups stop for wait-duration-in-open-state once failure-rate-threshold % of the last
# sliding-window-size lookups (at least minimum-number-of-calls) failed; scans then skip the lot checks.
app.consumer.circuit-breaker.failure-rate-threshold=50
app.consumer.circuit-breaker.sliding-window-size=10
app.consumer.circuit-breaker.minimum-number-of-calls=5
app.consumer.circuit-breaker.wait-duration-in-open-state=30s
app.consumer.circuit-breaker.permitted-calls-in-half-open-state=2

# Last lot-stage catalog fetched from the consumer, served when the consumer can't be reached.
app.lot-stages.cache-file=./data/lot-stages.json
